  <script>
  'use strict';
  const byId = id => document.getElementById(id);
  const minute = 60000;
  const clock = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  });
  const timestamps = ['observedAt', 'checkedAt', 'resetAt'];
  const dataIds = ['balances','details','edition','lines','record-list','hero-name','hero-value','hero-note',
    'hero-bars','hero-time','brief-copy','brief-time','brief-date','brief-label'];
  const team = document.documentElement.dataset.source === 'team';
  const pageNames = { overview:'额度总览', ledger:'采集记录', brief:'团队早报', sources:'资讯指南' };
  const statusNames = { ready:'可用', empty:'已用尽', stale:'待更新', unavailable:'待采样' };
  const aad = new TextEncoder().encode('magpie-shared-report-v1');
  let session = null;
  let request = null;
  let payload = null;
  let pollTimer, displayTimer;
  let recommendation = null, news = null, newsRequest = null, newsGroup = 'news', newsChecked = 0;

  function base64bytes(text) {
    if (typeof text !== 'string' || !/^[A-Za-z0-9_-]+$/.test(text)) throw Error();
    const base = text.replaceAll('-', '+').replaceAll('_', '/');
    const raw = atob(base);
    if (btoa(raw).replace(/=+$/, '') !== base) throw Error();
    return Uint8Array.from(raw, char => char.charCodeAt(0));
  }

  function fragmentKey(hash) {
    const match = /^#k=([A-Za-z0-9_-]{43})$/.exec(hash);
    if (!match) throw Error();
    const bytes = base64bytes(match[1]);
    if (bytes.length !== 32) throw Error();
    return bytes;
  }

  async function unlock(envelope, key) {
    if (envelope?.v !== 1) throw Error();
    const iv = base64bytes(envelope.iv);
    const encrypted = base64bytes(envelope.data);
    if (iv.length !== 12 || encrypted.length < 16) throw Error();
    const clear = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: aad, tagLength: 128 }, key, encrypted);
    return validate(JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(clear)));
  }

  function instant(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d\d-\d\dT(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(value)) return NaN;
    const day = value.slice(0, 10);
    const midnight = Date.parse(day + 'T00:00:00Z');
    if (!Number.isFinite(midnight) || new Date(midnight).toISOString().slice(0, 10) !== day) return NaN;
    return Date.parse(value);
  }

  function hasFields(value, fields) {
    return value !== null && typeof value === 'object' && !Array.isArray(value) &&
      Object.keys(value).length === fields.length && fields.every(field => Object.hasOwn(value, field));
  }

  function validAccounts(accounts) {
    const fields = ['account', 'status', 'product', 'plan', 'window', 'remainingPercent', ...timestamps];
    const optionalText = value => value === null || typeof value === 'string';
    return Array.isArray(accounts) && accounts.length === 2 && ['Qi', 'MOU'].every((name, index) => {
      const row = accounts[index];
      return (hasFields(row, fields) || (hasFields(row, [...fields, 'windows']) && validWindows(row.windows))) && row.account === name &&
        ['ready', 'empty', 'stale', 'unavailable'].includes(row.status) &&
        [null, 'codex', 'chatgpt'].includes(row.product) && optionalText(row.plan) && optionalText(row.window) &&
        (row.remainingPercent === null || (Number.isFinite(row.remainingPercent) &&
          row.remainingPercent >= 0 && row.remainingPercent <= 100)) &&
        timestamps.every(field => row[field] === null || Number.isFinite(instant(row[field])));
    });
  }

  function validWindows(windows) {
    if (!Array.isArray(windows) || windows.length < 1 || windows.length > 16) return false;
    const names = new Set();
    return windows.every(row => {
      if (!hasFields(row, ['window', 'status', 'remainingPercent', 'resetAt']) ||
          typeof row.window !== 'string' || !/^(?:\d{1,3} (?:分钟|小时|天|周)|每日|每周|每月)$/u.test(row.window) ||
          names.has(row.window) || (row.resetAt !== null && !Number.isFinite(instant(row.resetAt)))) return false;
      names.add(row.window);
      const value = row.remainingPercent;
      return row.status === 'unavailable' ? value === null :
        Number.isFinite(value) && value >= 0 && value <= 100 && (row.status === 'stale' || row.status === (value === 0 ? 'empty' : 'ready'));
    });
  }

  function validate(record) {
    if (!hasFields(record, ['v', 'publishedAt', 'accounts', 'report']) || record.v !== 2 ||
        !Number.isFinite(instant(record.publishedAt)) || !/(?:Z|[+]00:00)$/.test(record.publishedAt) ||
        !validAccounts(record.accounts)) throw Error();
    const report = record.report;
    if (report !== null && (!hasFields(report, ['day', 'generatedAt', 'accounts']) ||
        typeof report.day !== 'string' || !/^\d{4}-\d\d-\d\d$/.test(report.day) ||
        !Number.isFinite(instant(report.day + 'T00:00:00Z')) || !Number.isFinite(instant(report.generatedAt)) ||
        !validAccounts(report.accounts))) throw Error();
    return record;
  }

  function publicText(value) {
    if (!value) return '';
    if (session?.hash && value.includes(session.hash.slice(3))) return '（已省略）';
    if (/(?:\/\/|#k=|[a-z\d_-]{43,}|(?:[a-z\d_-]+\.)+[a-z]{2,}\b|(?:\d{1,3}\.){3}\d{1,3}|localhost|::|(?:[\da-f]{1,4}:){7}[\da-f]{1,4}|[a-z]:\\)/i.test(value)) return '（已省略）';
    return value;
  }

  function liveView(live, now) {
    const checked = instant(live.checkedAt), observed = instant(live.observedAt), reset = instant(live.resetAt);
    const unknown = { value: '—', condition: '暂无有效读数。' };
    if (live.status === 'unavailable') return unknown;
    if (reset <= now) return { value: '—', condition: '窗口已到重置时间，等待新的实测读数。' };
    if (live.status === 'stale' || now >= checked + 15 * minute || now >= observed + 120 * minute)
      return { value: '—', condition: '读数已过期，等待新的采样。' };
    if (!Number.isFinite(checked) || !Number.isFinite(observed) || checked > now || observed > now ||
        live.remainingPercent === null || (live.status === 'empty' && live.remainingPercent !== 0)) return unknown;
    return { value: live.remainingPercent + '%', condition: live.remainingPercent === 0 ? '当前窗口额度已用尽。' : '当前窗口的实测余量' };
  }

  function setText(id, text) {
    if (byId(id).textContent !== text) byId(id).textContent = text;
  }

  function textNode(tag, text) {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
  }

  function styled(tag, className, text = '') {
    const node = textNode(tag, text);
    node.className = className;
    return node;
  }

  function timeText(value, compact = false) {
    const time = instant(value);
    if (!Number.isFinite(time)) return '待确认';
    const full = clock.format(time);
    return compact ? full.slice(5,16).replace('-', '/') : full;
  }

  function scope(row) {
    return row.product === 'codex' ? '订阅内 Codex 额度' : row.product === 'chatgpt' ? 'ChatGPT 主额度' : '订阅额度待确认';
  }

  function windowRows(row) {
    return row.windows ?? (row.window ? [row] : []);
  }

  function reading(row, now, expired, checkWindows = true) {
    if (expired) return { value:'—', condition:'发布数据已过期，等待新读数。' };
    const view = liveView(row,now);
    if (!checkWindows || !row.windows || view.value === '—') return view;
    for (const entry of row.windows) {
      const individual = liveView({ ...row,...entry },now);
      if (individual.value === '—') return { value:'—', condition:`${entry.window}窗口 · ${individual.condition}` };
    }
    const minimum = Math.min(...row.windows.map(entry => entry.remainingPercent));
    return minimum === row.remainingPercent && row.windows.some(entry => entry.window === row.window && entry.remainingPercent === minimum)
      ? view : { value:'—', condition:'窗口与汇总读数待重新核对。' };
  }

  function meter(value) {
    const rail = styled('div', 'rail');
    rail.setAttribute('aria-hidden', 'true');
    const fill = document.createElement('i');
    fill.style.width = value === '—' ? '0%' : value;
    rail.append(fill);
    return rail;
  }

  function windowMeters(row, now, expired) {
    return windowRows(row).map(window => {
      const value = reading({ ...row, ...window }, now, expired, false).value;
      const line = styled('div', window.window === row.window ? 'meter-row limiting' : 'meter-row');
      line.append(textNode('span', publicText(window.window)), meter(value), textNode('span', value));
      return line;
    });
  }

  function accountDetails(row, view, asOf, frozen, expired = false) {
    const section = document.createElement('section');
    section.className = 'account-details';
    const heading = frozen ? `${row.account} · ${view.value}` : `${row.account} 额度明细`;
    section.append(textNode('h3', heading), textNode('p', view.condition));
    const list = document.createElement('dl');
    const observed = instant(row.observedAt);
    const elapsed = Math.floor((asOf - observed) / minute);
    const age = elapsed >= 1440 ? Math.floor(elapsed / 1440) + ' 天前' :
      elapsed >= 60 ? Math.floor(elapsed / 60) + ' 小时前' : elapsed > 0 ? elapsed + ' 分钟前' : '刚刚';
    const product = { codex: 'ChatGPT 订阅内的 Codex 额度', chatgpt: 'ChatGPT 主额度' }[row.product];
    list.append(textNode('dt', '适用范围'), textNode('dd', [product, publicText(row.plan)].filter(Boolean).join(' · ') || '未知'),
      textNode('dt', '额度窗口'), textNode('dd', publicText(row.window) || '未知'));
    for (const [field, label] of [['observedAt', '采样'], ['checkedAt', '检查'], ['resetAt', '重置']]) {
      const time = instant(row[field]);
      const suffix = field === 'observedAt' && !frozen && elapsed >= 0 ? `（${age}）` : '';
      list.append(textNode('dt', label + ' · 北京时间'), textNode('dd', Number.isFinite(time) ? clock.format(time) + suffix : '未知'));
    }
    section.append(list);
    if (row.windows) for (const entry of row.windows) {
      const current = reading({ ...row, ...entry }, asOf, expired, false);
      section.append(styled('p','meta', `${entry.window} · ${current.value} · 重置 ${timeText(entry.resetAt)}`));
    }
    return section;
  }

  function accountCard(row, view, now, expired) {
    const card = styled('article','card account-card');
    const head = styled('div','card-head');
    const state = view.value === '—' ? '待更新' : statusNames[row.status];
    head.append(styled('span','mark',row.account === 'Qi' ? 'Q' : 'M'), styled('span','tag','ChatGPT · ' + state));
    card.append(head, textNode('h3', row.account + ' 账户'), styled('p','meta',[publicText(row.plan),scope(row)].filter(Boolean).join(' · ')));
    const line = styled('div','value-line');
    line.append(styled('strong','card-value',view.value),styled('span','tag',publicText(row.window) || '窗口待确认'));
    card.append(line,meter(view.value),styled('p','meta',row.resetAt ? `${timeText(row.resetAt,true)} 重置` : view.condition));
    const disclosure = document.createElement('details');
    disclosure.id = 'windows-' + row.account;
    const original = byId(disclosure.id);
    if (original?.open) disclosure.open = true;
    disclosure.append(textNode('summary','窗口明细'));
    const details = accountDetails(row, view, now, false, expired);
    details.firstElementChild.remove();
    disclosure.append(details);
    card.append(disclosure);
    return card;
  }

  function replaceContents(id, nodes) {
    const current = byId(id);
    if (current.children.length === nodes.length && nodes.every((node,index) => node.isEqualNode(current.children[index]))) return;
    const focused = current.contains(document.activeElement) ? document.activeElement.closest('details')?.id : null;
    current.replaceChildren(...nodes);
    if (focused) byId(focused)?.querySelector('summary')?.focus({preventScroll:true});
  }

  function render(now = Date.now()) {
    clearTimeout(displayTimer);
    const { accounts, report } = payload;
    const published = instant(payload.publishedAt);
    const expired = now >= published + 15 * minute;
    const balances = [], details = [], records = [], deadlines = [published + 15 * minute];
    recommendation = null;
    let highest = -1;
    for (const row of accounts) {
      const view = reading(row, now, expired);
      if (view.value !== '—' && row.remainingPercent > 0 && row.remainingPercent > highest) {
        recommendation = row;
        highest = row.remainingPercent;
      }
      const balance = document.createElement('p');
      balance.className = 'balance';
      const value = textNode('span', view.value);
      value.className = 'value';
      balance.append(textNode('strong', row.account), value);
      const stat = styled('div','stat');
      stat.append(balance,styled('p','meta',[publicText(row.window),scope(row)].filter(Boolean).join(' · ')));
      balances.push(stat);
      details.push(accountCard(row,view,now,expired));
      const log = styled('article','log-row');
      const info = document.createElement('div');
      info.append(textNode('strong',row.account + ' · ' + view.value),styled('p','meta',scope(row) + ' · ' + view.condition));
      log.append(info,styled('p','meta',`采样 ${timeText(row.observedAt)}　检查 ${timeText(row.checkedAt)}`));
      records.push(log);
      const observed = instant(row.observedAt);
      deadlines.push(instant(row.resetAt), instant(row.checkedAt) + 15 * minute, observed + 120 * minute,
        observed + (Math.floor((now - observed) / minute) + 1) * minute, ...windowRows(row).map(entry => instant(entry.resetAt)));
    }
    replaceContents('balances', balances);
    replaceContents('details', details);
    replaceContents('record-list', records);
    const chosen = recommendation;
    setText('hero-name',chosen ? chosen.account + ' 账户' : '暂无可推荐账户');
    setText('hero-value',chosen ? highest + '%' : '—');
    setText('hero-note',chosen ? [scope(chosen),publicText(chosen.window) + '剩余'].join(' · ') :
      accounts.every(row => reading(row,now,expired).value === '0%') ? '两个账户目前均已用尽。' : '等待读数有效且有余量的账户。');
    replaceContents('hero-bars',chosen ? windowMeters(chosen,now,expired) : []);
    setText('hero-time',chosen ? `重置 ${timeText(chosen.resetAt,true)}　·　采样 ${timeText(chosen.observedAt,true)}` : '下次采集后自动更新');
    byId('hero-go').hidden = !chosen;
    const day = clock.format(now).slice(0, 10);
    const knownCount = accounts.filter(row => reading(row,now,expired).value !== '—').length;
    const health = knownCount === 2 ? 'ready' : 'waiting';
    byId('message').dataset.health = health;
    setText('message', (knownCount === 2 ? '每 5 分钟检查' : knownCount ? '一个账户的额度待确认' : '等待新的有效采样') +
      ' · 发布于 ' + clock.format(published).slice(11,16));
    const nine = Date.parse(day + 'T09:00:00+08:00');
    const generated = instant(report?.generatedAt);
    const formal = now >= nine && report?.day === day && generated >= nine &&
      generated <= Math.min(now, instant(payload.publishedAt)) &&
      clock.format(generated).startsWith(day);
    setText('report-title', formal ? (generated >= nine + minute ? '延时补报' : '09:00 正式早报') : '今日早报');
    setText('edition', formal ? `生成于 ${clock.format(generated)}（北京时间）` :
      now < nine ? '北京时间尚未到 09:00，今日正式早报待发布。' : '尚无今日正式早报。');
    replaceContents('lines',formal ? report.accounts.map(row => accountDetails(row,reading(row,generated,false),generated,true)) : []);
    setText('brief-label',formal ? '☼ ' + byId('report-title').textContent : '☼ 今日早报');
    setText('brief-date',day);
    setText('brief-copy',formal ? report.accounts.map(row => `${row.account} 账户 ${reading(row,generated,false).value}`).join('　·　') : byId('edition').textContent);
    setText('brief-time',formal ? `生成于 ${timeText(report.generatedAt,true)} · 北京时间` : '每日 09:00 · 北京时间');
    setText('dateline',new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(now) + ' · 北京时间');
    deadlines.push(nine, nine + 15 * 60 * minute, generated);
    const next = Math.min(...deadlines.filter(time => time > now));
    if (!document.hidden && Number.isFinite(next)) displayTimer = setTimeout(() => payload && render(), next - now);
  }

  function clearContent() {
    clearTimeout(displayTimer);
    payload = null;
    recommendation = null;
    byId('content').hidden = byId('save').hidden = byId('navigation').hidden = byId('hero-go').hidden = true;
    byId('copy-link').hidden = byId('copy-field').hidden = true;
    byId('copy-field').value = '';
    setText('copy-result','');
    for (const id of dataIds) byId(id).replaceChildren();
    setText('report-title', '今日早报');
    setText('dateline', '');
  }

  function stopRequest() {
    clearTimeout(pollTimer);
    request?.abort();
    request = null;
  }

  function failure(message, recover = false) {
    clearContent();
    setText('message', message);
    byId('message').dataset.health = 'waiting';
    byId('recovery').hidden = !recover;
    byId('retry').hidden = !session;
  }

  function pageView() {
    const name = new URL(location.href).searchParams.get('view');
    return Object.hasOwn(pageNames,name) ? name : 'overview';
  }

  function showPage(focus = false) {
    const view = pageView();
    setText('page-title',pageNames[view]);
    document.title = '余量 / MAGPIE · ' + pageNames[view];
    for (const link of document.querySelectorAll('a[data-view]')) {
      const url = new URL(location.href);
      url.searchParams.set('view',link.dataset.view);
      link.href = url.href;
      if (link.closest('nav') && view === link.dataset.view) link.setAttribute('aria-current','page');
      else link.removeAttribute('aria-current');
    }
    for (const panel of document.querySelectorAll('[data-panel]')) {
      panel.hidden = panel.dataset.panel !== view && !(view === 'overview' && panel.dataset.panel === 'sources');
    }
    if (focus) {
      byId('page-title').focus({preventScroll:true});
      window.scrollTo(0,0);
      const panel = document.querySelector(`[data-panel="${view}"]`);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && panel.animate) {
        for (const animation of panel.getAnimations()) animation.cancel();
        panel.animate([{opacity:.65,transform:'translateY(2px)'},{opacity:1,transform:'none'}],{duration:140,easing:'ease-out'});
      }
    }
  }

  function articleLink(value, group) {
    try {
      const url = new URL(value);
      if (url.protocol !== 'https:' || url.username || url.password || url.port || url.search || url.hash) return null;
      if (group === 'guides' && url.hostname === 'book.oiloil.org' &&
          /^\/articles\/(?:unrolling-the-codex-agent-loop|how-i-use-llms)$/.test(url.pathname)) return url.href;
      if (group === 'news' && url.hostname === 'aihot.news' && /^\/(?:items|story)\/[\w-]+$/.test(url.pathname)) return url.href;
      if (group === 'resets' && ((url.hostname === 'aihot.news' && /^\/codex-reset(?:\/history\/\d{4}-\d\d-\d\d)?\/?$/.test(url.pathname)) ||
          (/^(?:x|twitter)\.com$/.test(url.hostname) && /^\/\w+\/status\/\d+$/.test(url.pathname)))) return url.href;
    } catch {}
    return null;
  }

  function showNews() {
    const fragment = document.createDocumentFragment();
    for (const item of (news?.[newsGroup] ?? [])) {
      const href = articleLink(item?.url,newsGroup);
      if (!href || typeof item.title !== 'string' || !item.title.trim()) continue;
      const link = textNode('a',item.title + ' ↗');
      link.href = href; link.rel = 'noopener noreferrer'; link.target = '_blank';
      const article = styled('article','news-row');
      const date = /^\d{4}-\d\d-\d\d$/.test(item.at) ? item.at : Number.isFinite(instant(item.at)) ? timeText(item.at,true) : '';
      article.append(styled('p','meta',[item.source,date].filter(Boolean).join(' · ')),link);
      fragment.append(article);
    }
    if (!fragment.childElementCount) fragment.append(styled('p','note',news ? '本栏暂时没有已核实的条目。' :
      newsRequest ? '正在读取资讯…' : '资讯暂时无法读取，可点「重新读取」重试。'));
    byId('news-list').replaceChildren(fragment);
    setText('news-checked',Number.isFinite(instant(news?.checkedAt)) ? '来源核对 ' + timeText(news.checkedAt,true) + ' · 北京时间' : '');
    for (const button of document.querySelectorAll('[data-news]')) button.setAttribute('aria-pressed',String(button.dataset.news === newsGroup));
  }

  async function refreshNews(force) {
    if (newsRequest || (!force && news && Date.now() < newsChecked + 30 * minute)) return;
    const controller = new AbortController();
    newsRequest = controller;
    const timer = setTimeout(() => controller.abort(),8000);
    showNews();
    try {
      const result = await fetch('./dashboard-news.json',{signal:controller.signal,cache:'no-cache',credentials:team ? 'same-origin' : 'omit',
        referrerPolicy:'no-referrer',redirect:'error'});
      if (!result.ok) throw Error();
      const body = await result.json();
      if (!['news','guides','resets'].every(group => Array.isArray(body?.[group]))) throw Error();
      if (newsRequest === controller) { news = body; newsChecked = Date.now(); }
    } catch {} finally {
      clearTimeout(timer);
      if (newsRequest === controller) { newsRequest = null; if (payload) showNews(); }
    }
  }

  function display(record, forceNews) {
    payload = record;
    byId('recovery').hidden = true;
    byId('content').hidden = byId('navigation').hidden = byId('save').hidden = byId('retry').hidden = false;
    byId('copy-link').hidden = team;
    showPage();
    render();
    refreshNews(forceNews);
  }

  function sourcesFor(origin, now) {
    const raw = { url: 'https://raw.githubusercontent.com/r4ain1/magpie-quota-demo/brief-current/current.json?t=' + Math.floor(now / minute) };
    const api = { url: 'https://api.github.com/repos/r4ain1/magpie-quota-demo/contents/current.json?ref=brief-current', accept: 'application/vnd.github.raw+json' };
    const primary = 'https://magpie-morning-r4ain1.vercel.app';
    if (origin === primary) return [{ url: '/current.json' }, raw, api];
    const snapshot = { url: './current.json', snapshot: true };
    return origin.startsWith('https://') ? [api, raw, { url: primary + '/current.json' }, snapshot] : [snapshot];
  }

  async function readSource(source, signal) {
    const attempt = new AbortController();
    const cancel = () => attempt.abort();
    signal.addEventListener('abort', cancel, { once: true });
    const timeout = setTimeout(cancel, 4500);
    try {
      const response = await fetch(source.url, { cache: 'no-store', credentials: 'omit', mode: 'cors',
        headers: source.accept ? { Accept: source.accept } : {},
        redirect: 'error', referrerPolicy: 'no-referrer', signal: attempt.signal });
      if (!response.ok) return { status: response.status };
      const envelope = await response.json();
      if (envelope?.v !== 1 || typeof envelope.iv !== 'string' || typeof envelope.data !== 'string') throw Error();
      return { envelope };
    } finally {
      clearTimeout(timeout);
      signal.removeEventListener('abort', cancel);
    }
  }

  async function refresh(forceNews = false) {
    if (session?.hash !== location.hash) return start();
    if (!session || document.hidden) return;
    stopRequest();
    if (!navigator.onLine) return failure('当前离线。联网后会重新读取，也可手动重试。');
    if (payload) render();
    else setText('message',team ? '正在读取本机 Magpie…' : '正在读取公司额度…');
    const controller = new AbortController();
    request = controller;
    const active = () => request === controller && session?.hash === location.hash;
    let repeat = true, refreshDelay = minute;
    try {
      if (team) {
        const timeout = setTimeout(() => controller.abort(),9000);
        let response;
        try {
          response = await fetch('/api/dashboard',{cache:'no-store',credentials:'same-origin',redirect:'error',signal:controller.signal});
          if (!active()) return;
          if (response.status === 403) return failure('当前未获访问权限。请打开「成员与客户端」查看访问状态。');
          if (!response.ok) return failure('本机额度暂时无法读取，请重试。');
          const record = validate(await response.json());
          if (!active()) return;
          const published = instant(record.publishedAt);
          if (published < session.latest || published > Date.now() + 5 * minute) return failure('发布版本或时间异常，等待重新读取。');
          session.latest = published;
          display(record,forceNews);
        } finally { clearTimeout(timeout); }
        return;
      }
      const sources = sourcesFor(location.origin, Date.now());
      const key = await crypto.subtle.importKey('raw', fragmentKey(session.hash), 'AES-GCM', false, ['decrypt']);
      let missing = true, timeError = false;
      for (const source of sources) {
        if (!active()) return;
        let result;
        try {
          result = await readSource(source, controller.signal);
        } catch {
          missing = false;
          continue;
        }
        if (!active()) return;
        if (source.snapshot) {
          if (timeError) break;
          return failure('暂时无法核实最新早报，请点「重新读取」。');
        }
        if (result.status === 410) {
          repeat = false;
          return failure('分享已失效或已撤下。请向分享者索取最新完整链接。', true);
        }
        if (!result.envelope) {
          if (![401, 403, 404].includes(result.status)) missing = false;
          continue;
        }
        const record = await unlock(result.envelope, key);
        if (!active()) return;
        const published = instant(record.publishedAt);
        if (published < session.latest || published > Date.now() + 5 * minute) {
          timeError = true;
          continue;
        }
        session.latest = Math.max(session.latest, published);
        if (source.accept) {
          const nextUpload = Math.floor(Date.now() / (5 * minute)) * 5 * minute + 25_000;
          refreshDelay = nextUpload > Date.now() ? nextUpload - Date.now() : nextUpload + 5 * minute - Date.now();
        }
        display(record,forceNews);
        return;
      }
      if (!active()) return;
      if (timeError) failure('发布版本或时间异常，等待重新读取。');
      else if (missing) failure('未找到分享文件，链接可能已失效。请确认最新完整链接。', true);
      else failure('读取失败。请检查网络后重新读取。');
    } catch {
      if (!active()) return;
      if (team) return failure('本机额度暂时无法读取，请重试。');
      repeat = false;
      failure('无法解锁。链接可能已失效，或分享文件损坏。请重新打开最新完整链接。', true);
    } finally {
      if (active()) {
        request = null;
        if (repeat && !document.hidden && navigator.onLine) pollTimer = setTimeout(refresh, refreshDelay);
      }
    }
  }

  function start() {
    const legacy = team && /^#(overview|ledger|brief|sources)$/.exec(location.hash);
    if (legacy) history.replaceState(null,'',location.pathname + '?view=' + legacy[1]);
    const latest = session?.hash === location.hash ? session.latest : -Infinity;
    stopRequest();
    clearContent();
    session = null;
    byId('link').value = '';
    byId('retry').hidden = byId('recovery').hidden = true;
    showPage();
    if (team) {
      byId('manage').hidden = false;
      document.querySelector('.film').href = 'https://r4ain1.github.io/magpie-quota-demo/film.mp4';
      session = { hash:location.hash, latest };
      return refresh();
    }
    try { fragmentKey(location.hash); } catch {
      return failure('请打开分享者发来的完整 HTTPS 链接，保留末尾的 #k= 部分。也可以粘贴到下方，在本机解锁。', true);
    }
    if (!globalThis.crypto?.subtle) return failure('此浏览器无法安全解锁。请在系统浏览器打开完整 HTTPS 链接。', true);
    session = { hash: location.hash, latest };
    refresh();
  }

  byId('recovery').addEventListener('submit', event => {
    event.preventDefault();
    const field = byId('link');
    try {
      const link = new URL(field.value.trim());
      const ownPage = link.origin === location.origin && link.pathname === location.pathname;
      const pagesReader = link.origin === 'https://r4ain1.github.io' && /^\/magpie-quota-demo\/(?:index\.html|report\.html)?$/.test(link.pathname);
      const mirrorReader = link.origin === 'https://magpie-morning-r4ain1.vercel.app' && ['/','/report.html','/index.html'].includes(link.pathname);
      if (link.protocol !== 'https:' || !(ownPage || pagesReader || mirrorReader) ||
          (link.search && !/^\?view=(?:overview|ledger|brief|sources)$/.test(link.search)) || link.username || link.password) throw Error();
      fragmentKey(link.hash);
      history.replaceState(null, '', location.pathname + link.search + link.hash);
      start();
      byId('retry').hidden = false;
      byId('retry').focus();
    } catch {
      field.value = '';
      setText('message', '链接无效。请粘贴指向本阅读页、含完整 #k= 的 HTTPS 链接。');
      field.focus();
    }
  });
  byId('retry').addEventListener('click', () => refresh(true));
  byId('copy-link').addEventListener('click',async () => {
    if (team || !payload || session?.hash !== location.hash) return;
    const url = new URL(location.href);
    url.search = '';
    try {
      await navigator.clipboard.writeText(url.href);
      if (payload && session?.hash === url.hash) setText('copy-result','总览链接已复制，可以发给同事。');
    } catch {
      if (!payload || session?.hash !== url.hash) return;
      const field = byId('copy-field');
      field.value = url.href; field.hidden = false; field.focus(); field.select();
      setText('copy-result','已选中完整链接，点「复制」即可转发。');
    }
  });
  byId('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = (root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
    root.dataset.theme = dark ? 'light' : 'dark';
    byId('theme').setAttribute('aria-label',dark ? '切换到深色外观' : '切换到浅色外观');
  });
  document.addEventListener('click',event => {
    const link = event.target.closest('a[data-view]');
    if (link && !event.ctrlKey && !event.altKey && !event.shiftKey && !event.metaKey && event.button === 0) {
      event.preventDefault();
      if (pageView() !== link.dataset.view) history.pushState(null,'',link.href);
      showPage(true);
    }
    const button = event.target.closest('[data-news]');
    if (button) { newsGroup = button.dataset.news; showNews(); }
  });
  window.addEventListener('popstate',() => { if (session?.hash === location.hash) showPage(true); });
  byId('hero-go').addEventListener('click',() => {
    if (!recommendation) return;
    const detail = byId('windows-' + recommendation.account);
    detail.open = true;
    detail.querySelector('summary').focus({preventScroll:true});
    detail.closest('article').scrollIntoView({block:'nearest'});
  });
  byId('save').addEventListener('click', () => {
    if (session?.hash !== location.hash) return start();
    if (!payload) return;
    const now = Date.now();
    render(now);
    const snapshot = document.implementation.createHTMLDocument('额度简报 · 离线快照');
    snapshot.documentElement.lang = 'zh-CN';
    for (const selector of ['meta[charset]', 'meta[name=viewport]', 'style'])
      snapshot.head.prepend(document.querySelector(selector).cloneNode(true));
    const policy = snapshot.createElement('meta');
    policy.httpEquiv = 'Content-Security-Policy';
    policy.content = "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'";
    snapshot.head.prepend(policy);
    const main = snapshot.createElement('main');
    const heading = snapshot.createElement('h1');
    heading.textContent = '额度简报 · 离线快照';
    const saved = snapshot.createElement('p');
    saved.textContent = '发布于 ' + clock.format(instant(payload.publishedAt)) + '，保存于 ' +
      clock.format(now) + '（北京时间）。以下为保存时的记录。';
    main.append(heading,saved,textNode('h2','保存时剩余额度'),byId('balances').cloneNode(true));
    for (const row of payload.accounts) {
      const expired = now >= instant(payload.publishedAt) + 15 * minute;
      const section = accountDetails(row,reading(row,now,expired),now,false,expired);
      main.append(section);
    }
    for (const id of ['report-title','edition','lines']) main.append(byId(id).cloneNode(true));
    snapshot.body.append(main);
    const url = URL.createObjectURL(new Blob(['<!doctype html>\n', snapshot.documentElement.outerHTML], { type: 'text/html;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = '额度简报-' + clock.format(now).slice(0, 10) + '.html';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), minute);
  });
  function resume() {
    if (session && session.hash === location.hash) refresh();
    else start();
  }
  window.addEventListener('hashchange', start);
  window.addEventListener('offline', () => {
    stopRequest();
    if (session) failure('当前离线。联网后会重新读取，也可手动重试。');
  });
  window.addEventListener('online', resume);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopRequest(); clearContent(); }
    else resume();
  });
  window.addEventListener('pagehide', () => {
    stopRequest();
    clearContent();
    byId('link').value = '';
  });
  window.addEventListener('pageshow', event => { if (event.persisted) resume(); });
  start();
  </script>
</body>
</html>
