name: Publish migration notice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-demo-feed
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Stage migration notice
        id: site
        shell: bash
        run: |
          site=$(mktemp -d "$RUNNER_TEMP/demo-pages.XXXXXXXX")
          [[ -f migration/index.html && ! -L migration && ! -L migration/index.html ]]
          install -m 0644 -- migration/index.html "$site/index.html"
          echo "path=$site" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
